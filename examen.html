<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark px-3">
      <span class="navbar-brand mb-0 h1">Miapp</span>
      <button
        class="btn btn-warning"
        data-bs-toggle="modal"
        data-bs-target="#modalNota"
      >
        Añadir nota
      </button>
    </nav>

    <div class="container mt-4">
      <div class="row" id="panel"></div>
    </div>

    <div class="modal fade" id="modalNota" data-bs-theme="dark">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Nueva nota</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="titulo">Título de la nota</label>
              <input type="text" class="form-control" id="titulo" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="ancho">Ancho de la nota</label>
              <select class="form-select" id="ancho">
                <option value="col-2">Small</option>
                <option value="col-4">Medium</option>
                <option value="col-6">High</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="color">Color de la nota</label>
              <select class="form-select" id="color">
                <option value="bg-danger">Roja</option>
                <option value="bg-success">Verde</option>
                <option value="bg-primary">Azul</option>
                <option value="bg-warning">Amarilla</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              id="guardar"
              data-bs-dismiss="modal"
            >
              Guardar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </body>
</html>
